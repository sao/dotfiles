# starship.toml
# Minimal, fast prompt. Docs: https://starship.rs/config/

format = """
$directory$git_branch$git_status$python$node$rust$golang$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold blue"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
style        = "bold red"
ahead        = "⇡${count}"
behind       = "⇣${count}"
diverged     = "⇕⇡${ahead_count}⇣${behind_count}"
modified     = "!${count}"
untracked    = "?${count}"
staged       = "+${count}"
deleted      = "✘${count}"

[python]
symbol         = " "
python_binary  = ["python3", "python"]
detect_files   = ["pyproject.toml", "requirements.txt", ".python-version", "uv.lock"]

[nodejs]
symbol       = " "
detect_files = ["package.json", ".nvmrc", ".node-version"]

[cmd_duration]
min_time = 2000
format   = "[ $duration](bold yellow)"

[line_break]
disabled = false
